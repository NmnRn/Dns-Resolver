{% load static i18n %}{% get_current_language as CUR_LANG %}<!DOCTYPE html>
<html lang="{{ CUR_LANG }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ mode_title }} · DNS Panel</title>
    <link rel="icon" type="image/png" href="{% static 'dashboard/img/logo.png' %}?v={{ static_v }}">
    <script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
    <link rel="stylesheet" href="{% static 'dashboard/css/login.css' %}?v={{ static_v }}">
</head>
<body>
    <form class="card" method="post">
        {% csrf_token %}
        <div class="brand"><span class="dot"></span>dns.panel</div>
        <p class="hint">{{ hint }}</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label for="username">{% trans "Kullanıcı adı" %}</label>
        <input id="username" name="username" autocomplete="username" autofocus value="{{ username }}">
        <label for="password">{% trans "Parola" %}</label>
        <input id="password" name="password" type="password" autocomplete="{{ pw_autocomplete }}">
        <button type="submit">{{ submit }}</button>
    </form>
</body>
</html>
