services:
  dns-python:
    build: .
    container_name: dns-python
    restart: unless-stopped
    # PID 1'i tini yapar: zombi toplama + sinyalleri run_all.py'ye iletir.
    init: true
    environment:
      # NOT: Sunucu topolojisi (hangi metot açık + iç/dış portlar + cert yolları +
      # allowed_host + site_port) artık .env/DB'de DEĞİL → config/servers.json
      # (aşağıda ./config bind ile bağlı). setup.sh / start.sh / panel yazar.
      # .env yalnız SIR + DB + Django içindir.
      #
      # DB ayarları host'taki .env'den okunur (install.sh yazar); imajın içindeki
      # .env bilerek boştur (.dockerignore) — değerler buradan geçer.
      - DB_HOST=${DB_HOST:-172.27.17.1}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-dns_user}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-dns_db}
      # --- Web paneli (Django) ---
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      # DEBUG=False iken zorunlu. Site 127.0.0.1'e/tünele bağlı olduğundan "*"
      # kabul edilebilir; herkese açık yayınlanacaksa gerçek domain'e daralt.
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      # Prod'da MUTLAKA .env'de kendi rastgele anahtarını ver.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      # Panel çerezleri: HttpOnly + SameSite her zaman açık. "Secure" bayrağı
      # çerezi yalnız HTTPS'te gönderir → düz-HTTP SSH tüneli (127.0.0.1) girişini
      # bozmasın diye varsayılan False; paneli SALT HTTPS'te yayınlıyorsan True yap.
      - DJANGO_SECURE_COOKIES=${DJANGO_SECURE_COOKIES:-False}
      # Domain/ters proxy arkasından form POST'u için (ör. https://dns.example.com).
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # DNS sorgu günlüğünde client_ip'yi at-rest şifrelemek için (opsiyonel).
      # Boşsa şifreleme kapalı (IP düz saklanır). Anahtar üretimi logcrypto.py'de.
      - DNS_LOG_KEY=${DNS_LOG_KEY:-}
    # Host'a port YAYINI (site paneli + yayınlanan DNS metotları) start.sh tarafından
    # config/servers.json'dan üretilen docker-compose.override.yml ile yapılır
    # (Docker, override.yml'i otomatik birleştirir). Base compose port açmaz.
    # Container yine dns-net'te 172.27.17.2 üzerinden erişilebilir (Cloudflare Tunnel).
    volumes:
      # Django'nun SQLite'ı (auth/session) recreate'lerde kaybolmasın.
      - django-data:/app/data
      # Sunucu topolojisi TEK kaynak (setup.sh/start.sh/panel yazar; resolver okur).
      # PATH bind (ayrı named volume DEĞİL) → host'tan düzenlenebilir + kalıcı.
      - ./config:/app/config
      # TLS sertifikaları: imaja gömülmez (.dockerignore), host'tan salt-okunur bağlanır.
      # Böylece yenilenen sertifikalar rebuild gerektirmeden yansır.
      - ./certificates:/app/certificates:ro
    networks:
      dns-net:
        ipv4_address: 172.27.17.2

networks:
  dns-net:
    external: true

volumes:
  django-data:
